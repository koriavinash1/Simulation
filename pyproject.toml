[project]
name = "tuna-fisheries-monte-carlo"
version = "0.1.0"
description = "Monte Carlo simulator for tuna fisheries, EM adoption, policy, markets and blue finance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10"
]

[project.scripts]
tuna-sim = "simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
